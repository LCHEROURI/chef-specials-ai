<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Lund Podiatry — PROTOTYPE BUILD card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1E3D"/>
      <stop offset="1" stop-color="#1B2E5A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C242"/>
      <stop offset="1" stop-color="#E8A512"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Mark: brand -->
  <g transform="translate(80,80)">
    <rect width="120" height="120" rx="22" fill="#0F1E3D"/>
    <path d="M36 36h22v52h44v22H36z" fill="#F5C242"/>
    <text x="160" y="74" fill="#F5C242" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-weight="800" font-size="56">Lund Podiatry</text>
    <text x="160" y="110" fill="#E8EEF9" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="26">Step without pain.</text>
  </g>

  <!-- Tagline strip -->
  <rect x="80" y="280" width="1040" height="4" fill="url(#gold)"/>

  <!-- Big hero -->
  <text x="80" y="380" fill="#FFFFFF" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-weight="800" font-size="74">Expert foot &amp; ankle care.</text>
  <text x="80" y="450" fill="#A8B7D2" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="34">Personalized treatment · Most insurance accepted</text>

  <!-- Prototype badge -->
  <g transform="translate(80,500)">
    <rect width="380" height="56" rx="28" fill="#F5C242"/>
    <text x="190" y="36" fill="#0F1E3D" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" text-anchor="middle">⚠ PROTOTYPE BUILD · placeholder data</text>
  </g>

  <!-- Footer line -->
  <text x="80" y="600" fill="#7E8FAE" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20">lundpodiatry.com · Boulder, Colorado</text>
</svg>
