name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  verify-env:
    name: Verify Environment & Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate environment variables (production mode)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ secrets.OPENAI_IMAGE_QUALITY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/verify-env.js --mode=production --check-deployment

  deploy-preview:
    name: Deploy Preview (PR)
    runs-on: ubuntu-latest
    needs: [verify-env]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Normalize Vercel identifiers
        env:
          RAW_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RAW_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "VERCEL_ORG_ID=$(printf '%s' "$RAW_ORG_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$(printf '%s' "$RAW_PROJECT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Pull Vercel environment (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel preview
        id: deploy_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview deployed: $PREVIEW_URL"

      - name: Post-deploy smoke test (preview)
        env:
          DEPLOY_URL: ${{ steps.deploy_preview.outputs.preview_url }}
        run: node scripts/smoke-test.js "$DEPLOY_URL"

  deploy-production:
    name: Deploy Production (main)
    runs-on: ubuntu-latest
    needs: [verify-env]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy_prod.outputs.production_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Normalize Vercel identifiers
        env:
          RAW_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RAW_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "VERCEL_ORG_ID=$(printf '%s' "$RAW_ORG_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$(printf '%s' "$RAW_PROJECT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Pull Vercel environment (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        id: deploy_prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROD_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "production_url=$PROD_URL" >> $GITHUB_OUTPUT
          echo "Production deployed: $PROD_URL"

      - name: Post-deploy smoke test (production)
        env:
          DEPLOY_URL: ${{ steps.deploy_prod.outputs.production_url }}
        run: node scripts/smoke-test.js "$DEPLOY_URL"
